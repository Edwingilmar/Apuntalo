name: Build APUNTALO APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'APUNTALO-proyecto-android.zip'
      - '.github/workflows/android.yml'
      - 'alpha/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: unzip -o APUNTALO-proyecto-android.zip

      - name: Locate Gradle project
        shell: bash
        run: |
          PROJECT_DIR="$(find . -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró settings.gradle.kts dentro del ZIP."
            find . -maxdepth 5 -type f
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Apply Alpha implementation
        shell: bash
        run: |
          cp alpha/MainActivity.kt "$PROJECT_DIR/app/src/main/java/com/gilmar/apuntalo/MainActivity.kt"
          sed -i 's/versionCode = 1/versionCode = 3/;s/versionName = "1.0"/versionName = "1.0-beta"/' "$PROJECT_DIR/app/build.gradle.kts"
          sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"\/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"\/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/><uses-permission android:name="android.permission.INTERNET"\/><uses-permission android:name="android.permission.READ_CALENDAR"\/><uses-permission android:name="android.permission.WRITE_CALENDAR"\/><application android:icon="@android:drawable\/ic_menu_edit"/' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          sed -i 's#</application>#<receiver android:name=".ReminderReceiver" android:exported="false"/><receiver android:name=".BootReceiver" android:exported="false"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver></application>#' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Install task widget resources
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/res/layout" "$PROJECT_DIR/app/src/main/res/xml"
          cp alpha/apuntalo_widget.xml "$PROJECT_DIR/app/src/main/res/layout/apuntalo_widget.xml"
          cat > "$PROJECT_DIR/app/src/main/res/xml/apuntalo_widget_info.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="260dp" android:minHeight="150dp"
              android:initialLayout="@layout/apuntalo_widget"
              android:updatePeriodMillis="1800000"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"/>
          EOF
          python3 - <<'PY'
          import os
          from pathlib import Path
          manifest=Path(os.environ["PROJECT_DIR"])/"app/src/main/AndroidManifest.xml"
          content=manifest.read_text()
          receiver='''<receiver android:name=".TaskWidgetProvider" android:exported="true">
            <intent-filter>
              <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
              <action android:name="com.gilmar.apuntalo.REFRESH_WIDGET"/>
            </intent-filter>
            <meta-data android:name="android.appwidget.provider" android:resource="@xml/apuntalo_widget_info"/>
          </receiver>'''
          content=content.replace("</application>",receiver+"</application>")
          manifest.write_text(content)
          PY

      - name: Install exact approved splash and launcher icon
        shell: bash
        run: |
          python3 -m pip install --user Pillow
          mkdir -p "$PROJECT_DIR/app/src/main/res/drawable-nodpi"
          base64 -d alpha/approved_splash.jpg.base64 > "$PROJECT_DIR/app/src/main/res/drawable-nodpi/apuntalo_splash.jpg"
          base64 -d alpha/approved_icon.jpg.base64 > "$PROJECT_DIR/app/src/main/res/drawable-nodpi/apuntalo_icon_original.jpg"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          from PIL import Image
          base=Path(os.environ["PROJECT_DIR"])/"app/src/main/res"
          source=Image.open(base/"drawable-nodpi/apuntalo_icon_original.jpg").convert("RGB")
          # Remove all near-white/neutral backing pixels, not just the outer connected region.
          # The original icon contains a white rounded square inside the image itself.
          logo=source.resize((512,512),Image.Resampling.LANCZOS).convert("RGBA")
          pixels=logo.load()
          for y in range(logo.height):
              for x in range(logo.width):
                  red,green,blue,_=pixels[x,y]
                  low=min(red,green,blue)
                  spread=max(red,green,blue)-low
                  if low>=225 and spread<=30:
                      pixels[x,y]=(red,green,blue,0)
                  elif low>=195 and spread<=24:
                      alpha=round(255*(225-low)/30)
                      pixels[x,y]=(red,green,blue,alpha)
          logo.save(base/"drawable-nodpi/apuntalo_launcher_logo.png")
          for density,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder=base/('mipmap-'+density)
              folder.mkdir(parents=True,exist_ok=True)
              logo.resize((size,size),Image.Resampling.LANCZOS).save(folder/'apuntalo_launcher.png')
          manifest=base.parent/"AndroidManifest.xml"
          content=manifest.read_text()
          content=re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/apuntalo_launcher"',content)
          content=re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/apuntalo_launcher"',content)
          manifest.write_text(content)
          PY

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APUNTALO-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
